<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Movie Finder</title>
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
		<main>
			<h1>Movie Finder</h1>
			<input type="text" id="titleInput" placeholder="Enter movie title">
			<button id="searchBtn" type="button">Search Movie</button>
			<p id="message"></p>
			<div id="result">
				<h2 id="titleYear"></h2>
				<p id="rating"></p>
				<p id="plot"></p>
				<button id="watchlistBtn" type="button">Add to Watchlist</button>
			</div>
		</main>
		<script src="script.js"></script>
	</body>
</html>
